name: CI

on:
  push:
    # Both names on purpose. This repository's default branch is `master`,
    # while the workflows were written for `main` — so nothing triggered on a
    # push and the pipeline had never run once. Listing both means it works now
    # and keeps working if the branch is ever renamed.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberately weak, local-only, and never used outside this ephemeral job.
  # The production values live in Cloudflare Secrets and are never in CI.
  DATABASE_URL: postgresql://inkloom:inkloom_ci@127.0.0.1:5432/inkloom
  TEST_DATABASE_URL: postgresql://inkloom:inkloom_ci@127.0.0.1:5432/inkloom_test
  INKLOOM_ENV: test
  APP_URL: http://localhost:5173
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
  ACCESS_CODE_PEPPER: ci-only-access-code-pepper-32-chars-x
  IP_HASH_PEPPER: ci-only-ip-hash-pepper-32-characters
  EMAIL_TRANSPORT: mailpit
  MAILPIT_HOST: 127.0.0.1
  TURNSTILE_ENABLED: "false"
  RATE_LIMIT_ENABLED: "true"
  LOG_LEVEL: error

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: anything that needs no database runs first and in parallel,
  # so a formatting mistake fails in under a minute rather than after the whole
  # integration suite.
  # ---------------------------------------------------------------------------
  static:
    name: Format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Generate route types
        run: pnpm --filter @inkloom/web exec react-router typegen

      - name: Type check
        run: pnpm -r exec tsc --noEmit

  # ---------------------------------------------------------------------------
  # Secret scanning. Separate job so it reports independently and is impossible
  # to overlook inside a longer log.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret committed earlier and later removed is
          # still found.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Scan source
        run: pnpm secrets:check

      - name: Scan git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Unit tests: pure functions, no database. Fast enough to run everywhere.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # Integration, concurrency and security tests against a REAL Postgres.
  #
  # A container rather than a mock, because the guarantees under test are
  # database guarantees: unique constraints, row locks, append-only triggers.
  # A mocked database cannot demonstrate that two racing transactions produce
  # exactly one redemption, which is the single most important assertion here.
  # ---------------------------------------------------------------------------
  database:
    name: Integration, concurrency and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inkloom
          POSTGRES_PASSWORD: inkloom_ci
          POSTGRES_DB: inkloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Create the isolated test database
        run: |
          PGPASSWORD=inkloom_ci psql -h 127.0.0.1 -U inkloom -d inkloom \
            -c "CREATE DATABASE inkloom_test OWNER inkloom;"

      - name: Apply migrations
        run: pnpm db:migrate

      # Proves the migrations are complete: if the schema and the migrations
      # have diverged, drizzle-kit finds a pending change and this fails.
      - name: Migration validation
        run: |
          pnpm db:check
          pnpm --filter @inkloom/db exec drizzle-kit generate --name=ci_drift_check
          if git diff --name-only --exit-code packages/db/migrations; then
            echo "Schema and migrations agree."
          else
            echo "::error::The Drizzle schema has changes with no migration. Run 'pnpm db:generate' and commit the result."
            git diff packages/db/migrations
            exit 1
          fi

      - name: Integration and concurrency tests
        run: pnpm test:integration

      - name: Security tests
        run: pnpm test:security

      - name: Reconciliation must report no drift
        run: pnpm credits:reconcile

  # ---------------------------------------------------------------------------
  # Production build, plus a scan of the ACTUAL client bundle for server secrets.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: OpenAPI is in step with the schemas
        run: |
          pnpm openapi:emit
          if ! git diff --exit-code openapi.json; then
            echo "::error::openapi.json is stale. Run 'pnpm openapi:emit' and commit it."
            exit 1
          fi

      # The check that matters most: a secret can be perfectly safe in a server
      # file and catastrophic if a bundler inlines it into the browser bundle.
      - name: No server secrets in the client bundle
        run: pnpm secrets:check

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/web/build
          retention-days: 7

  # ---------------------------------------------------------------------------
  # End-to-end: a real browser against a real Worker, database and mail server.
  # ---------------------------------------------------------------------------
  e2e:
    # SHARDED, and it has to be. 95 journeys run strictly serially — they share
    # feature flags, campaigns and rate-limit overrides, so parallel workers
    # would race each other rather than the code — against a Vite dev server
    # that compiles each route on first request. One runner took longer than the
    # 30-minute cap and was cancelled mid-suite, which is a red pipeline that
    # tells you nothing.
    #
    # Each shard is a separate runner with its OWN postgres and mailpit, so the
    # serial guarantee holds inside a shard and there is no shared state between
    # them. `fail-fast: false` because one broken journey should not hide the
    # state of the other three quarters of the suite.
    name: End-to-end tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [static]

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # NOT `services:`, and that is the whole point.
    #
    # A service container publishes its port through docker-proxy, so
    # 127.0.0.1:5432 on the runner is a forwarder rather than a listening
    # database. Node connects through it happily — migrations and the seed ran
    # fine — but the Worker does not: workerd refused every connection with
    # "connect(): Connection refused", so every page whose loader touches the
    # database rendered an error boundary, hydration never completed, and 11
    # journeys failed on a 20-second wait for a page that was never coming.
    #
    # `--network host` puts postgres and mailpit on the runner's own network
    # namespace, listening on the real loopback with nothing in between. It is
    # also how a developer runs them locally, so CI and a laptop now fail and
    # pass for the same reasons.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Start postgres and mailpit on the host network
        run: |
          # max_connections is raised and logging turned up for a reason: the
          # Worker opens ONE client per request and closes it after the
          # response, so a browser-driven suite can hold a surprising number at
          # once. `log_connections` makes an exhausted server say so in its own
          # words instead of surfacing as an unexplained refusal at the client.
          docker run -d --name inkloom-postgres --network host \
            -e POSTGRES_USER=inkloom -e POSTGRES_PASSWORD=inkloom_ci -e POSTGRES_DB=inkloom \
            postgres:17-alpine \
            -c max_connections=400 -c log_connections=on -c log_disconnections=on
          docker run -d --name inkloom-mailpit --network host axllent/mailpit:latest

          for attempt in $(seq 1 30); do
            if docker exec inkloom-postgres pg_isready -U inkloom -h 127.0.0.1 >/dev/null 2>&1; then
              echo "postgres is accepting connections."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::postgres never became ready."
              docker logs inkloom-postgres
              exit 1
            fi
            sleep 2
          done

          # Proves the loopback listener is real, from OUTSIDE the container —
          # which is the exact thing a service container did not provide.
          until nc -z 127.0.0.1 5432; do sleep 1; done
          until nc -z 127.0.0.1 8025; do sleep 1; done

          # Printed so the next person debugging this can see in one glance
          # whether postgres itself is on the port or a docker-proxy forwarder.
          echo "--- listeners ---"
          ss -ltnp 2>/dev/null | grep -E ':(5432|8025|1025)\b' || true

      - name: Prepare the database
        run: |
          pnpm db:migrate
          pnpm db:seed

      # The job-level `env:` block above reaches Node — migrations, the seed,
      # the Playwright process — but NOT the Worker. The dev server runs the
      # application inside workerd, whose environment is assembled from
      # wrangler.jsonc `vars` plus `.dev.vars`, and inherits nothing from the
      # shell that launched it. Locally an untracked `.dev.vars` supplies the
      # secrets, which is why this was invisible until CI ran for the first
      # time: every developer had the file, the runner had no such file, and
      # the Worker answered every request with `BETTER_AUTH_SECRET: expected
      # string, received undefined`.
      #
      # Only the values with no safe default are written here. Everything else
      # is deliberately left to wrangler.jsonc, so the suite runs against the
      # same configuration a developer has locally rather than a CI-only one.
      - name: Give the Worker its environment
        run: |
          cat > apps/web/.dev.vars <<'VARS'
          DATABASE_URL=postgres://inkloom:inkloom_ci@127.0.0.1:5432/inkloom
          BETTER_AUTH_SECRET=ci-only-secret-not-used-anywhere-else-000000
          ACCESS_CODE_PEPPER=ci-only-access-code-pepper-32-chars-x
          IP_HASH_PEPPER=ci-only-ip-hash-pepper-32-characters
          # Cloudflare's documented always-passes test secret, paired with the
          # always-passes sitekey already in wrangler.jsonc. Turnstile stays
          # ENABLED so the suite exercises the real gate — including
          # turnstile-resilience.spec.ts, which is meaningless with it off.
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          VARS

      # Proves, from this runner, that the URL the Worker was handed is one a
      # client can actually use. If this succeeds and the Worker still cannot
      # connect, the difference is workerd rather than the database — which is
      # exactly the distinction the failure mode does not make on its own.
      - name: The Worker's database URL, exercised
        run: |
          echo "url: $(sed -n 's|^DATABASE_URL=.*@|host: |p' apps/web/.dev.vars)"
          node -e "
            const { Client } = require('pg');
            const url = require('fs').readFileSync('apps/web/.dev.vars', 'utf8')
              .split('\n').find((l) => l.startsWith('DATABASE_URL=')).slice(13);
            const c = new Client({ connectionString: url });
            c.connect()
              .then(() => c.query('select 1'))
              .then(() => { console.log('node connected to the Worker URL: ok'); return c.end(); })
              .catch((e) => { console.log('node could NOT connect:', e.message); process.exit(1); });
          "

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/4

      # The database's own account of what happened, which the client side can
      # only guess at. A refusal looks identical from the outside whether the
      # server was unreachable, out of connection slots, or never asked.
      - name: What postgres saw
        if: always()
        run: |
          echo "--- connection errors ---"
          docker logs inkloom-postgres 2>&1 | grep -iE "too many|fatal|could not|reject" | tail -30 || true
          echo "--- peak connections ---"
          docker exec inkloom-postgres psql -U inkloom -d inkloom -tAc \
            "SELECT count(*) || ' open now, max_connections=' || current_setting('max_connections')
               FROM pg_stat_activity" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Dependency vulnerabilities. Advisory-only on a PR so a fresh advisory in a
  # transitive dependency does not block an unrelated fix, but it is always
  # visible and always reported.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # A single gate for branch protection to require.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [static, secrets, unit, database, build, e2e]
    if: always()
    steps:
      - name: Verify every required job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
