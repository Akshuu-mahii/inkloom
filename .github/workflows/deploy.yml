name: Deploy

on:
  # ON GREEN CI, not on push.
  #
  # A push trigger deploys whatever was pushed, including a commit whose tests
  # are still running or have already failed — so staging would routinely be
  # running code the pipeline was in the middle of rejecting. Waiting for CI
  # costs a few minutes and means "deployed" implies "verified".
  #
  # Both branch names on purpose: this repository's default branch is `master`
  # while the workflows were written for `main`, which is why nothing triggered
  # at all until recently. Listing both works now and survives a rename.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: For production only — type "deploy production"
        required: false
        type: string

concurrency:
  # Never let two deploys race a migration against each other.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Staging deploys automatically once CI is green on the default branch.
  # ---------------------------------------------------------------------------
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A completed CI run is not a passed one: `workflow_run` fires on failure
    # and cancellation too, so the conclusion has to be checked explicitly or
    # every red build would deploy itself.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.inkloom.art

    steps:
      # The exact commit CI verified. `workflow_run` runs against the default
      # branch's workflow file, and without this the checkout would take
      # whatever is newest instead of what was tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Migrations run BEFORE the deploy, so the new code never meets an old
      # schema. Every migration must therefore be backward-compatible with the
      # currently-running version — see docs/DEPLOYMENT.md.
      # ADMIN_PATH here is STAGING's. Production has a different one, under
      # PRODUCTION_ADMIN_PATH — the two environments deliberately do not share a
      # console address, so neither can be reached by guessing from the other.
      - name: Required secrets are present
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PATH; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under"
            echo "::error::Settings -> Secrets and variables -> Actions. ADMIN_PATH must match"
            echo "::error::the ADMIN_PATH secret set on the Worker, or the console is unreachable."
            exit 1
          fi
          echo "All deploy secrets present."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}

      # The same gate the production migration uses: resolve the Hyperdrive
      # binding this environment actually runs on, and refuse unless
      # DATABASE_URL is that exact database. A deploy that migrates the wrong
      # one is not a deploy that can be rolled back.
      - name: Confirm the target is the staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:verify-target staging

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      # Drizzle records that a migration ran, not that its effect survived.
      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:status --verify

      # BOTH variables matter at BUILD time, and neither was set here.
      #
      # `react-router build` bakes the environment into the bundle, so
      # `wrangler deploy --env staging` cannot change it afterwards — without
      # CLOUDFLARE_ENV the deploy would ship a development build to staging.
      # And routes.ts reads ADMIN_PATH to decide where to mount the console;
      # missing, it mounts at /admin while the Worker serves a 404 decoy there,
      # leaving the console unreachable at every address. routes.ts refuses to
      # build a deployed environment without it rather than guessing.
      - name: Build
        env:
          CLOUDFLARE_ENV: staging
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env staging

      - name: Health check
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS https://staging.inkloom.art/api/ready | grep -q '"status":"ready"'; then
              echo "Staging is ready."
              exit 0
            fi
            echo "Attempt $attempt: not ready yet."
            sleep 6
          done
          echo "::error::Staging did not become ready."
          exit 1

      - name: Post-deploy smoke test
        env:
          E2E_BASE_URL: https://staging.inkloom.art
          # Staging sits behind Cloudflare Access. These are an Access SERVICE
          # TOKEN — a credential for CI, listed in ACCESS_SERVICE_TOKENS on the
          # Worker and revocable without touching anyone's own access. Unset
          # while Access is off, and the headers are then simply not sent.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          pnpm exec playwright install --with-deps chromium
          # Read-only journeys only: this runs against a shared environment, so
          # it must not create accounts or move credits.
          pnpm exec playwright test e2e/marketing.spec.ts --project=chromium

  # ---------------------------------------------------------------------------
  # Production requires a human, and the human is the typed phrase below.
  #
  # GitHub's required-reviewers rule is the control this SHOULD lean on, and it
  # is not available: environment protection rules need a paid plan on a private
  # repository, and an attempt to configure them here is rejected outright. The
  # `production` environment still exists — it scopes the deployment history and
  # any environment-level secrets — but it gates nothing, so nothing in this
  # file should be written as though it does.
  #
  # Buying GitHub Team turns this into a real approval step; until then the
  # phrase is what stands between a stray click on "Run workflow" and a release.
  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://inkloom.art

    steps:
      - name: Confirmation phrase
        run: |
          if [ "$CONFIRM" != "deploy production" ]; then
            echo "::error::Set the confirm input to 'deploy production'. Nothing ran."
            exit 1
          fi
        env:
          CONFIRM: ${{ inputs.confirm }}

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Printed for the approving reviewer BEFORE anything is applied, so a
      # destructive migration is seen rather than discovered.
      - name: Required secrets are present
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_ADMIN_PATH; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under"
            echo "::error::Settings -> Secrets and variables -> Actions. PRODUCTION_ADMIN_PATH must"
            echo "::error::match the ADMIN_PATH secret on the production Worker, or the console is"
            echo "::error::unreachable at every address."
            exit 1
          fi
          echo "All deploy secrets present."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_ADMIN_PATH: ${{ secrets.PRODUCTION_ADMIN_PATH }}

      - name: Confirm the target is the production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:verify-target production

      # Asked of the DATABASE, not of git. The previous version of this step
      # diffed HEAD~1, which answers "what did this commit add" — a different
      # question from "what has this database not had applied yet", and the two
      # disagree after any deploy that skipped a release.
      #
      # It also refuses migrations that are not backward-compatible with the
      # version currently running, because migrations are applied before the new
      # code ships. Use the separate "Migrate production database" workflow with
      # allow_destructive when a breaking change is genuinely intended.
      - name: Migration plan
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -o pipefail
          {
            echo "### Migrations in this deploy"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm db:status --sql 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:status --verify

      # See the note on the staging build: both are build-time, and a deploy
      # without them is silently wrong rather than loudly broken.
      - name: Build
        env:
          CLOUDFLARE_ENV: production
          ADMIN_PATH: ${{ secrets.PRODUCTION_ADMIN_PATH }}
        run: pnpm build

      - name: Confirm no secrets in the client bundle
        run: pnpm secrets:check

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production

      - name: Health check
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS https://inkloom.art/api/ready | grep -q '"status":"ready"'; then
              echo "Production is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production did not become ready — roll back (see docs/DEPLOYMENT.md)."
          exit 1

      - name: Post-deploy smoke test
        env:
          E2E_BASE_URL: https://inkloom.art
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/marketing.spec.ts --project=chromium

      - name: Reconciliation must report no drift
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm credits:reconcile

      - name: Record the deploy
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Rollback: \`wrangler rollback --env production\` (see docs/DEPLOYMENT.md)"
          } >> "$GITHUB_STEP_SUMMARY"
