name: Deploy

on:
  # ON GREEN CI, not on push.
  #
  # A push trigger deploys whatever was pushed, including a commit whose tests
  # are still running or have already failed — so staging would routinely be
  # running code the pipeline was in the middle of rejecting. Waiting for CI
  # costs a few minutes and means "deployed" implies "verified".
  #
  # Both branch names on purpose: this repository's default branch is `master`
  # while the workflows were written for `main`, which is why nothing triggered
  # at all until recently. Listing both works now and survives a rename.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # Never let two deploys race a migration against each other.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Staging deploys automatically once CI is green on the default branch.
  # ---------------------------------------------------------------------------
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A completed CI run is not a passed one: `workflow_run` fires on failure
    # and cancellation too, so the conclusion has to be checked explicitly or
    # every red build would deploy itself.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.inkloom.art

    steps:
      # The exact commit CI verified. `workflow_run` runs against the default
      # branch's workflow file, and without this the checkout would take
      # whatever is newest instead of what was tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Migrations run BEFORE the deploy, so the new code never meets an old
      # schema. Every migration must therefore be backward-compatible with the
      # currently-running version — see docs/DEPLOYMENT.md.
      - name: Required secrets are present
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PATH; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under"
            echo "::error::Settings -> Secrets and variables -> Actions. ADMIN_PATH must match"
            echo "::error::the ADMIN_PATH secret set on the Worker, or the console is unreachable."
            exit 1
          fi
          echo "All deploy secrets present."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      # BOTH variables matter at BUILD time, and neither was set here.
      #
      # `react-router build` bakes the environment into the bundle, so
      # `wrangler deploy --env staging` cannot change it afterwards — without
      # CLOUDFLARE_ENV the deploy would ship a development build to staging.
      # And routes.ts reads ADMIN_PATH to decide where to mount the console;
      # missing, it mounts at /admin while the Worker serves a 404 decoy there,
      # leaving the console unreachable at every address. routes.ts refuses to
      # build a deployed environment without it rather than guessing.
      - name: Build
        env:
          CLOUDFLARE_ENV: staging
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env staging

      - name: Health check
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS https://staging.inkloom.art/api/ready | grep -q '"status":"ready"'; then
              echo "Staging is ready."
              exit 0
            fi
            echo "Attempt $attempt: not ready yet."
            sleep 6
          done
          echo "::error::Staging did not become ready."
          exit 1

      - name: Post-deploy smoke test
        env:
          E2E_BASE_URL: https://staging.inkloom.art
          # Staging sits behind Cloudflare Access. These are an Access SERVICE
          # TOKEN — a credential for CI, listed in ACCESS_SERVICE_TOKENS on the
          # Worker and revocable without touching anyone's own access. Unset
          # while Access is off, and the headers are then simply not sent.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          pnpm exec playwright install --with-deps chromium
          # Read-only journeys only: this runs against a shared environment, so
          # it must not create accounts or move credits.
          pnpm exec playwright test e2e/marketing.spec.ts --project=chromium

  # ---------------------------------------------------------------------------
  # Production requires a human. The `production` GitHub environment is
  # configured with required reviewers, so this job pauses for approval before
  # any step runs.
  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://inkloom.art

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Printed for the approving reviewer BEFORE anything is applied, so a
      # destructive migration is seen rather than discovered.
      - name: Required secrets are present
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PATH; do
            eval "value=\$$name"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under"
            echo "::error::Settings -> Secrets and variables -> Actions. ADMIN_PATH must match"
            echo "::error::the ADMIN_PATH secret set on the Worker, or the console is unreachable."
            exit 1
          fi
          echo "All deploy secrets present."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}

      - name: Show pending migrations for review
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "### Migrations in this deploy" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only HEAD~1 HEAD -- packages/db/migrations | while read -r file; do
            echo "-- $file"; cat "$file"
          done >> "$GITHUB_STEP_SUMMARY" || echo "(none)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      # See the note on the staging build: both are build-time, and a deploy
      # without them is silently wrong rather than loudly broken.
      - name: Build
        env:
          CLOUDFLARE_ENV: production
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: pnpm build

      - name: Confirm no secrets in the client bundle
        run: pnpm secrets:check

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production

      - name: Health check
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS https://inkloom.art/api/ready | grep -q '"status":"ready"'; then
              echo "Production is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production did not become ready — roll back (see docs/DEPLOYMENT.md)."
          exit 1

      - name: Post-deploy smoke test
        env:
          E2E_BASE_URL: https://inkloom.art
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/marketing.spec.ts --project=chromium

      - name: Reconciliation must report no drift
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm credits:reconcile

      - name: Record the deploy
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Rollback: \`wrangler rollback --env production\` (see docs/DEPLOYMENT.md)"
          } >> "$GITHUB_STEP_SUMMARY"
