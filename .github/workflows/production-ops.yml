name: Production operations

# One-off operator tasks that need the production database.
#
# They live in a workflow because the production connection string is a GitHub
# secret and deliberately does not exist on anyone's laptop. Dispatch only, one
# task per run, each with its own typed confirmation.
#
# Deliberately NOT here: creating an access-code campaign. That needs
# ACCESS_CODE_PEPPER, which is a Cloudflare Worker secret, and copying it into
# GitHub to save a few clicks would double the number of places a pepper lives
# for the rest of the product's life. Campaigns are created from the admin
# console, which already holds the pepper it needs.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        required: true
        type: choice
        options: [bootstrap-owner, erase-account, acceptance, report]
        default: report
      email:
        description: The account to act on
        required: false
        type: string
      confirm:
        description: bootstrap-owner → "promote to super admin" · erase-account → "erase this account"
        required: false
        type: string
      apply:
        description: For erase-account — actually erase. Left off, it is a dry run.
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://inkloom.art

    steps:
      # Named explicitly, not "anything but report". A negative list makes every
      # future task destructive by default: `acceptance` is read-only, has no
      # phrase and needs no email, and was refused for lacking both.
      - name: Confirmation phrase
        if: inputs.task == 'bootstrap-owner' || inputs.task == 'erase-account'
        run: |
          case "$TASK" in
            bootstrap-owner) expected="promote to super admin" ;;
            erase-account)   expected="erase this account" ;;
          esac
          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::Confirmation phrase did not match. Nothing ran."
            exit 1
          fi
          if [ -z "$EMAIL" ]; then
            echo "::error::$TASK needs an email."
            exit 1
          fi
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm }}
          EMAIL: ${{ inputs.email }}

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The same gate every other production job uses. A task that promotes an
      # account to super_admin has no business running against a database nobody
      # has confirmed the identity of.
      - name: Confirm the target is the production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:verify-target production

      # The script refuses if the account does not exist, is unverified, or if a
      # super_admin already exists — none of which this workflow overrides. It
      # writes an audit event with actor `system` and a reason, so the first
      # privileged act on this database is as traceable as every later one.
      - name: Promote the owner
        if: inputs.task == 'bootstrap-owner'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm bootstrap:superadmin --email "${{ inputs.email }}"

      # Erasure on request, which is what /privacy has always described. Dry run
      # unless `apply` is ticked: the operator is acting on someone else's
      # behalf, and erasing the wrong account is the failure that matters.
      # `anonymiseAccount` refuses the last remaining owner on its own.
      - name: Erase the account
        if: inputs.task == 'erase-account'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm account:erase --email "${{ inputs.email }}" ${{ inputs.apply && '--apply' || '' }}

      # Read-only, against the deployed Worker AND the database. Not the staging
      # suites pointed at a new URL: those prove a control by exercising it, and
      # production is not a place to create accounts nobody asked for.
      - name: Production acceptance
        if: inputs.task == 'acceptance'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_URL: https://inkloom.art
          ADMIN_PATH: ${{ secrets.PRODUCTION_ADMIN_PATH }}
        run: |
          set -o pipefail
          {
            echo "### Production acceptance"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm accept:production 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -o pipefail
          {
            echo "### Production"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm db:status --verify 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm credits:reconcile 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
